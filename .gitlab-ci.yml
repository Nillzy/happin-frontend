stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

test:
  stage: test
  image: node:20-alpine
  before_script:
    - npm ci
  script:
    - npm run lint
    - npm run build
  only:
    - main
    - merge_requests

# Build Docker image and push to GitLab Container Registry
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build once with commit SHA tag
    - docker build
        --build-arg EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
        --build-arg EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL
        --build-arg EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY
        -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA .
    # Tag as latest (no rebuild!)
    - docker tag $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/frontend:latest
    # Push both tags
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  only:
    - main

# Deploy to VM (manual trigger)
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H vm552.ipp-vps.net >> ~/.ssh/known_hosts
  script:
    - ssh happin-deploy@vm552.ipp-vps.net "echo $GITLAB_DEPLOY_TOKEN | docker login registry.gitlab.com -u $GITLAB_DEPLOY_USERNAME --password-stdin && cd /home/shared/deployment && docker compose down frontend && docker rmi registry.gitlab.com/dhbw-se/se-tinf24b2/happin/frontend/frontend:latest || true && cd /home/shared/deployment/frontend && git pull origin main && cd /home/shared/deployment && docker compose pull frontend && docker compose up -d frontend"
  only:
    - main
  environment:
    name: production
    url: http://vm552.ipp-vps.net
